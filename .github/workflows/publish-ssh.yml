name: Publish independent ChatGPT / Codex SSH release

on:
  push:
    branches:
      - feature/keenetic-smart-vps-beta2
    paths:
      - .github/workflows/publish-ssh.yml
      - scripts/publish-ssh-release.py
      - release-source.txt
      - VERSION
      - internal/pilot/**
      - tests/**
      - scripts/check.sh
      - lua/**
  workflow_dispatch:
    inputs:
      source:
        description: "Build author label (recorded in metadata and filename)"
        required: true
        type: choice
        default: ChatGPT
        options:
          - ChatGPT

permissions:
  contents: write

concurrency:
  group: keenetic-pilot-ssh-release
  cancel-in-progress: false

jobs:
  independent-ssh-release:
    if: github.repository == 'punisher89/my.kn-test-' && github.ref == 'refs/heads/feature/keenetic-smart-vps-beta2'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Lua runtime for native tests
        run: sudo apt-get update && sudo apt-get install -y liblua5.4-0 libluajit-5.1-2
      - name: Check all tests, pinned nfqws2 and build all five architectures
        env:
          PILOT_TEST_BROWSER: "1"
        run: |
          npm install --prefix "$RUNNER_TEMP/pilot-browser" --no-save --no-audit --ignore-scripts playwright@1.62.1
          export NODE_PATH="$RUNNER_TEMP/pilot-browser/node_modules"
          export PILOT_CHROMIUM="$(command -v google-chrome)"
          sh scripts/check.sh
      - name: Verify and publish independent SSH release
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          origin="${REQUESTED_SOURCE:-}"
          if [ -z "$origin" ]; then origin="$(tr -d '\r\n' < release-source.txt)"; fi
          case "$origin" in ChatGPT) ;; *) echo "::error::Unknown release source"; exit 1 ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publish only the beta candidate. The legacy migration pointer is separate.
          test "$(cat VERSION)" = "0.2.0-beta.3"
          python3 scripts/publish-ssh-release.py --source "$origin" --push
      - name: Verify independent release is reachable via HTTPS
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          url="https://raw.githubusercontent.com/punisher89/my.kn-test-/refs/heads/ssh-releases/v$version"
          curl --proto '=https' -fsSL --retry 2 --max-time 40 "$url/release-info.json" -o /tmp/pilot-info.json
          python3 -c 'import json,os; i=json.load(open("/tmp/pilot-info.json")); assert i["version"] == open("VERSION").read().strip(); assert i["channel"]=="ssh" and i["source"] == "ChatGPT" and i["signed_panel_updater_modified"] is False'
          curl --proto '=https' -fsSL --retry 2 --max-time 40 "$url/SHA256SUMS" -o /tmp/pilot-manifest
          python3 -c 'import json,hashlib; i=json.load(open("/tmp/pilot-info.json")); assert hashlib.sha256(open("/tmp/pilot-manifest","rb").read()).hexdigest()==i["manifest_sha256"]'
          echo "Published independent SSH release; signed panel updater unchanged."
